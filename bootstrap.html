<!doctype html><html lang="ko"><meta charset="utf-8"><title>프리스타일 라이트 시작</title><body style="background:#142333;color:white;font:28px sans-serif;padding:10vh"><p id="state">앱을 준비하고 있어요.</p><script>(function(){var until=Date.now()+30000;function poll(){var x=new XMLHttpRequest();x.open('GET','http://127.0.0.1:18769/status',true);x.timeout=2000;function retry(){if(Date.now()<until)setTimeout(poll,500);else document.getElementById('state').textContent='앱을 다시 시작해 주세요. 업데이트 뒤에는 프로젝터 재부팅이 필요할 수 있어요.';}x.onload=function(){var s;try{s=JSON.parse(x.responseText);}catch(e){}if(x.status===200&&s&&s.app==='freestyle-lite'&&s.version==="0.4.0-rc.2")location.replace('http://127.0.0.1:18769/tv');else retry();};x.onerror=x.ontimeout=retry;x.send();}poll();})();</script></body></html>
